aid: daya-medika-pratama
name: Daya Medika Pratama
description: >-
  PT Daya Medika Pratama (DMP) is an Indonesian healthcare IT company in Central Jakarta
  that builds and implements hospital information systems and insurance core systems. It
  has worked in IT since 2007 — first as a systems integrator building data-acquisition
  systems for textile production machinery, later as a Microsoft Business Solution Partner
  in healthcare and education — and today sells AFYA Better HIS (a hospital information
  system with an openEHR-based clinical data repository, stated as connected to BPJS
  Kesehatan, Kemenkes/SATUSEHAT, FHIR and Better, and in use at more than 40 Indonesian
  hospitals), AFYA Insurance (policy and claims management), implementation of the Better
  digital health platform, and Microsoft Dynamics 365 as hospital back office. It is an
  openEHR industry partner and a Better (better.care) partner for the Indonesian market,
  and runs AFYA Better Academy, an openEHR and FHIR training programme for hospital IT
  staff. Its positioning line is "One Patient One Record for Better Health". DMP publishes
  no public API, developer portal, SDK or machine-readable contract; the standards it
  names are national platforms its products consume on a hospital's behalf, not APIs it
  ships.
